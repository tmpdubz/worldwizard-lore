backend:
  name: git-gateway
  branch: v4

media_folder: content/assets
public_folder: /assets

x-fields: &default-fields
  - { label: "Title", name: "title", widget: "string" }
  - { label: "Content", name: "body", widget: "markdown" }

collections:
  - name: "peoples"
    label: "Peoples & Civilizations"
    folder: "content/Peoples"
    create: true
    slug: "{{fields.title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Active Ages"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        options:
          - { label: "Primordial Age", value: "primordial-age" }
          - { label: "Prehistoric Age", value: "prehistoric-age" }
          - { label: "Ancient Age", value: "ancient-age" }
          - { label: "Present Age", value: "present-age" }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "geography"
    label: "Geography"
    folder: "content/Geography"
    create: true
    slug: "{{fields.title}}"
    fields: *default-fields

  - name: "cities"
    label: "Cities & Settlements"
    folder: "content/Cities"
    create: true
    slug: "{{fields.title}}"
    fields: *default-fields

  - name: "history"
    label: "History"
    folder: "content/History"
    create: true
    slug: "{{fields.title}}"
    fields: *default-fields

  - name: "avatars"
    label: "Avatars & Heroes"
    folder: "content/Avatars"
    create: true
    slug: "{{fields.title}}"
    fields: *default-fields

  - name: "campaigns"
    label: "Campaigns"
    folder: "content/Campaigns"
    create: true
    nested:
      depth: 3
    slug: "{{fields.title}}"
    fields: *default-fields
    filter:
      field: title
      value: "_Templates"
      pattern: "^(?!_Templates).*"

  - name: "canon_proposals"
    label: "Canon Proposals"
    folder: "content/Canon Proposals"
    create: true
    slug: "{{fields.title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Proposed", "Approved", "Rejected"]
        default: "Proposed"
      - { label: "Proposed by", name: "proposed_by", widget: "string" }
      - { label: "Source campaign", name: "source_campaign", widget: "string", required: false }
      - { label: "Content", name: "body", widget: "markdown" }
